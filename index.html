<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Israel Contreras — Remodelaciones El Negro">
  <meta property="og:description" content="Remodelaciones El Negro">

  <meta name="twitter:title" content="Israel Contreras — Remodelaciones El Negro">
  <meta name="twitter:description" content="Remodelaciones El Negro">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; background: #d6d6d6; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    :root {
      --charcoal: #2b2e3d;
      --orange:   #e8621a;
      --white:    #ffffff;
      --strong:   'Oswald', Arial, sans-serif;
      --sans:     Arial, Helvetica, sans-serif;
    }

    body {
      background: radial-gradient(ellipse at 50% 30%, #fde8d8 0%, #f0e8e0 70%);
      min-height: 100vh;
      padding: 20px 20px 24px;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Card shell ── */
    .card {
      width: 100%;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(232,98,26,0.25);
      box-shadow: 0 0 40px rgba(232,98,26,0.1), 0 8px 40px rgba(0,0,0,0.7);
    }

    /* ── Top section ── */
    .card-top {
      padding: 28px 32px 24px;
      text-align: center;
      position: relative;
      background: #ffffff;
      border-bottom: 1px solid rgba(232,98,26,0.3);
    }

    .card-icon {
      width: 240px;
      height: 240px;
      object-fit: contain;
      margin: 0 auto 18px;
    }

    .card-brand {
      font-family: var(--strong);
      font-weight: 700;
      font-size: clamp(1.3rem, 5vw, 1.6rem);
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--orange);
      color: var(--white);
      padding: 12px 32px;
      margin: 0 -32px 20px;
    }

    .card-name {
      font-family: var(--strong);
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.2;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--charcoal);
      margin-bottom: 0;
    }

    /* ── Orange services strip ── */
    .card-services-label { display: none; }

    .card-services {
      padding: 11px 20px;
      text-align: center;
      background: var(--orange);
      font-family: var(--strong);
      font-weight: 700;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--white);
    }

    /* ── Contact buttons ── */
    .card-contact {
      padding: 16px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      background: #111318;
    }

    .contact-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 16px;
      border-radius: 6px;
      font-family: var(--sans);
      font-size: 0.82rem;
      transition: opacity 0.18s ease, transform 0.1s ease;
      background: #181b22;
      border: 1px solid rgba(232,98,26,0.15);
      color: var(--white);
    }

    .contact-btn:hover { opacity: 0.75; }

    .contact-btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .contact-btn-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }

    .contact-btn:hover { opacity: 0.75; transform: translateY(-1px); }

    .contact-btn-type {
      font-size: 0.62rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(232,98,26,0.7);
    }

    .contact-btn-value {
      font-family: var(--strong);
      font-weight: 500;
      font-size: 1rem;
      color: var(--white);
      word-break: break-all;
      white-space: normal;
    }

    /* ── Corner bracket accents ── */
    .bracket {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--charcoal);
      border-style: solid;
      opacity: 0.3;
    }

    .bracket--tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .bracket--tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .bracket--bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .bracket--br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }
  </style>
</head>
<body>

  <div class="card">

    <div class="card-top">
      <div class="bracket bracket--tl"></div>
      <div class="bracket bracket--tr"></div>

      <img class="card-icon" src="logo.jpeg" alt="Remodelaciones El Negro">

      <p class="card-brand">Remodelaciones &ldquo;El Negro&rdquo;</p>
      <h1 class="card-name">Israel Contreras</h1>

      <div class="bracket bracket--bl"></div>
      <div class="bracket bracket--br"></div>
    </div>

    <div class="card-services-label">Se realizan trabajos de:</div>
    <div class="card-services">
      Herrería &nbsp;·&nbsp; Plomería &nbsp;·&nbsp; Tablaroca &nbsp;·&nbsp; Azulejo &nbsp;·&nbsp; Lambrín
    </div>

    <div class="card-contact">

      <a class="contact-btn"
         href="https://wa.me/5217771113757"
         target="_blank" rel="noopener noreferrer">
        <!-- WhatsApp icon -->
        <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        <span class="contact-btn-label">
          <span class="contact-btn-type">WhatsApp</span>
          <span class="contact-btn-value">+52 1 777 111 3757</span>
        </span>
      </a>

      <!-- Card number (tap to copy) -->
      <button class="contact-btn" onclick="copyCard(this)" type="button" style="width:100%;text-align:left;cursor:pointer">
        <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
          <line x1="1" y1="10" x2="23" y2="10"/>
        </svg>
        <span class="contact-btn-label">
          <span class="contact-btn-type">No. de tarjeta BANJERCITO</span>
          <span class="contact-btn-value" id="card-value">4913 4490 5553 6996</span>
        </span>
      </button>

      <!-- Save contact -->
      <button class="contact-btn" onclick="saveContact()" type="button" style="width:100%;justify-content:center;background:var(--orange);border-color:var(--orange);font-family:var(--strong);font-weight:700;letter-spacing:2px;font-size:0.78rem;text-transform:uppercase;cursor:pointer">
        <svg class="contact-btn-icon" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Guardar contacto
      </button>

    </div>

  </div>

  <script>
    function copyCard(btn) {
      navigator.clipboard.writeText('4913449055536996').then(function() {
        var val = btn.querySelector('#card-value');
        var orig = val.textContent;
        val.textContent = '¡Copiado!';
        setTimeout(function() { val.textContent = orig; }, 2000);
      }).catch(function() {
        var range = document.createRange();
        range.selectNode(btn.querySelector('#card-value'));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      });
    }

    function saveContact() {
      var vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:Israel Contreras',
        'N:Contreras;Israel;;;',
        'ORG:Remodelaciones El Negro',
        'TEL;TYPE=CELL,VOICE:+5217771113757',
        'NOTE:No. tarjeta BANJERCITO: 4913449055536996',
        'END:VCARD'
      ].join('\r\n');
      var blob = new Blob([vcard], { type: 'text/vcard' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Israel-Contreras-Remodelaciones.vcf';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>

  <footer style="text-align:center;padding:20px 0 12px">
    <a href="https://www.eurekawebsites.tech/" target="_blank" rel="noopener noreferrer" style="font-size:0.65rem;letter-spacing:1.5px;text-transform:uppercase;color:rgba(0,0,0,0.4);text-decoration:none;transition:color 0.2s" onmouseover="this.style.color='rgba(0,0,0,0.7)'" onmouseout="this.style.color='rgba(0,0,0,0.4)'"><img src="https://raw.githubusercontent.com/eurekawebsites/eureka-website/main/eureka-icon.svg" alt="" style="width:26px;height:26px;display:block;margin-right:7px;flex-shrink:0;" />POWERED BY EUREKA WEBSITES</a>
  </footer>

</body>
